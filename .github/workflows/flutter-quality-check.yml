name: Atlas Academy Flutter Quality Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate experimental molecular structure assets
        run: python scripts/build_pharmacology_molecular_models.py

      - name: Install dependencies
        run: flutter pub get

      - name: Validate Cloud Functions JavaScript syntax
        run: node --check functions/index.js

      - name: Analyze Dart and Flutter code
        run: flutter analyze --no-fatal-infos

      - name: Run automated tests
        run: flutter test
