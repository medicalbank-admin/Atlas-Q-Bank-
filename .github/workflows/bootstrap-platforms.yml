
name: Bootstrap Flutter Platforms

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Preserve Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/atlas-firebase-backup

          git show HEAD:android/app/google-services.json \
            > /tmp/atlas-firebase-backup/google-services.json

          if git cat-file -e HEAD:ios/Runner/GoogleService-Info.plist 2>/dev/null; then
            git show HEAD:ios/Runner/GoogleService-Info.plist \
              > /tmp/atlas-firebase-backup/GoogleService-Info.plist
          else
            echo "iOS plist not found in repository. Recreating it from supplied Firebase configuration."

            cat > /tmp/atlas-firebase-backup/GoogleService-Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key>
            <string>AIzaSyBbi3zlGggsct92f0qVkURMPN8ZheMcnQQ</string>
            <key>GCM_SENDER_ID</key>
            <string>299084089644</string>
            <key>PLIST_VERSION</key>
            <string>1</string>
            <key>BUNDLE_ID</key>
            <string>com.atlasacademy.app</string>
            <key>PROJECT_ID</key>
            <string>the-atlas-academy-3fae0</string>
            <key>STORAGE_BUCKET</key>
            <string>the-atlas-academy-3fae0.firebasestorage.app</string>
            <key>IS_ADS_ENABLED</key>
            <false/>
            <key>IS_ANALYTICS_ENABLED</key>
            <false/>
            <key>IS_APPINVITE_ENABLED</key>
            <true/>
            <key>IS_GCM_ENABLED</key>
            <true/>
            <key>IS_SIGNIN_ENABLED</key>
            <true/>
            <key>GOOGLE_APP_ID</key>
            <string>1:299084089644:ios:e8497f4a09e104268f0489</string>
          </dict>
          </plist>
          PLIST
          fi

          test -s /tmp/atlas-firebase-backup/google-services.json
          test -s /tmp/atlas-firebase-backup/GoogleService-Info.plist

      - name: Generate platform scaffolding
        shell: bash
        run: |
          set -euo pipefail

          flutter create \
            --platforms=android,ios,web \
            --org com.atlasacademy \
            --project-name atlas_academy \
            /tmp/atlas-platform

          rm -rf android ios web

          cp -a /tmp/atlas-platform/android ./android
          cp -a /tmp/atlas-platform/ios ./ios
          cp -a /tmp/atlas-platform/web ./web

          mkdir -p android/app ios/Runner

          cp /tmp/atlas-firebase-backup/google-services.json \
            android/app/google-services.json

          cp /tmp/atlas-firebase-backup/GoogleService-Info.plist \
            ios/Runner/GoogleService-Info.plist

      - name: Configure Firebase Android plugin
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path("android/settings.gradle.kts")
          app = Path("android/app/build.gradle.kts")

          if not settings.exists() or not app.exists():
              raise SystemExit("Expected Gradle files are missing.")

          s = settings.read_text()

          if "com.google.gms.google-services" not in s:
              s = s.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services") version "4.4.4" apply false',
                  1
              )

          settings.write_text(s)

          a = app.read_text()

          if 'id("com.google.gms.google-services")' not in a:
              a = a.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services")',
                  1
              )

          a = re.sub(
              r'namespace\s*=\s*"[^"]+"',
              'namespace = "com.atlasacademy.app"',
              a
          )

          a = re.sub(
              r'applicationId\s*=\s*"[^"]+"',
              'applicationId = "com.atlasacademy.app"',
              a
          )

          app.write_text(a)

          activities = list(
              Path("android/app/src/main").rglob("MainActivity.kt")
          )

          if not activities:
              raise SystemExit("MainActivity.kt is missing.")

          source = activities[0]
          content = source.read_text()

          content = re.sub(
              r'^package\s+.*$',
              'package com.atlasacademy.app',
              content,
              count=1,
              flags=re.MULTILINE
          )

          destination = Path(
              "android/app/src/main/kotlin/"
              "com/atlasacademy/app/MainActivity.kt"
          )

          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(content)

          if source != destination:
              source.unlink()

          pbx = Path("ios/Runner.xcodeproj/project.pbxproj")

          if pbx.exists():
              content = pbx.read_text()
              content = re.sub(
                  r'PRODUCT_BUNDLE_IDENTIFIER = [^;]+;',
                  'PRODUCT_BUNDLE_IDENTIFIER = com.atlasacademy.app;',
                  content
              )
              pbx.write_text(content)

          print("Android Firebase plugin configured.")
          PY

      - name: Verify generated files
        shell: bash
        run: |
          set -euo pipefail

          test -s android/app/google-services.json
          test -s ios/Runner/GoogleService-Info.plist
          test -s android/app/build.gradle.kts
          test -s ios/Runner.xcodeproj/project.pbxproj
          test -s web/index.html

          echo "All Android, iOS and Web files verified successfully."

      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add android ios web

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Generate Flutter platform scaffolding"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          
