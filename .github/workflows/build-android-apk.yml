name: Build Atlas Academy Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Java version
        run: java -version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Configure persistent Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing repository secret: ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p android/app/keystore
          printf "%s" "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore/atlas-release.jks
          test -s android/app/keystore/atlas-release.jks
          echo "Persistent keystore file created successfully."

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore/atlas-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --build-number=${{ github.run_number }} --dart-define=MCQ_API_URL=${{ vars.MCQ_API_URL }}

      - name: Remove signing material
        if: always()
        run: rm -rf android/app/keystore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: atlas-academy-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
