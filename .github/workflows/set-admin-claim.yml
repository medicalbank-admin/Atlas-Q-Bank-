name: Set Atlas Academy Administrator

on:
  workflow_dispatch:
    inputs:
      admin_uid:
        description: "Firebase UID of the administrator"
        required: true
        type: string
      confirmation:
        description: "Type CONFIRM to authorize this administrator"
        required: true
        type: string

permissions:
  contents: read

jobs:
  set-admin:
    name: Assign Trusted Admin Claim
    runs-on: ubuntu-latest

    steps:
      - name: Check confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          ADMIN_UID: ${{ inputs.admin_uid }}
        run: |
          if [ "$CONFIRMATION" != "CONFIRM" ]; then
            echo "Confirmation failed."
            exit 1
          fi

          if [ -z "$ADMIN_UID" ]; then
            echo "Administrator UID is required."
            exit 1
          fi

      - name: Set Firebase custom claim
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ADMIN_UID: ${{ inputs.admin_uid }}
        run: |
          npm install firebase-admin

          node <<'NODE'
          const { initializeApp, cert } = require('firebase-admin/app');
          const { getAuth } = require('firebase-admin/auth');

          async function main() {
            const credentials = JSON.parse(
              process.env.FIREBASE_SERVICE_ACCOUNT
            );

            initializeApp({
              credential: cert(credentials)
            });

            const uid = process.env.ADMIN_UID.trim();
            const auth = getAuth();

            const user = await auth.getUser(uid);

            await auth.setCustomUserClaims(uid, {
              ...(user.customClaims || {}),
              admin: true
            });

            console.log('Administrator authorization assigned successfully.');
            console.log('Authorized UID:', uid);
          }

          main()
            .then(() => process.exit(0))
            .catch((error) => {
              console.error('Administrator setup failed:', error.message);
              process.exit(1);
            });
          NODE
