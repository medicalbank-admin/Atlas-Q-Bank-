name: Deploy Atlas Academy MCQ API to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cloudflare/mcq-api/**"
      - ".github/workflows/deploy-mcq-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Worker JavaScript
        run: node --check cloudflare/mcq-api/src/index.js

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare repository secrets are missing."
            exit 1
          fi
          wrangler deploy --config cloudflare/mcq-api/wrangler.toml

      - name: Upload Firebase service credential securely
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "The FIREBASE_SERVICE_ACCOUNT repository secret is missing."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | wrangler secret put FIREBASE_SERVICE_ACCOUNT --config cloudflare/mcq-api/wrangler.toml

      - name: Configure GitHub Releases storage credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_RELEASES_TOKEN: ${{ secrets.ATLAS_RELEASES_GITHUB_TOKEN }}
        run: |
          if [ -z "$GITHUB_RELEASES_TOKEN" ]; then
            echo "The ATLAS_RELEASES_GITHUB_TOKEN repository secret is missing."
            exit 1
          fi
          printf '%s' "$GITHUB_RELEASES_TOKEN" | wrangler secret put GITHUB_RELEASES_TOKEN --config cloudflare/mcq-api/wrangler.toml

      - name: Verify Worker and Firestore connection
        run: |
          curl --retry 5 --retry-delay 2 --retry-connrefused --fail-with-body \
            https://atlas-academy-mcq-api.medicalbankadmin.workers.dev/health
