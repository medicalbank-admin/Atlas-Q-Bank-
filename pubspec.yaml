name: atlas_academy
description: The Atlas Academy - Prepare Smarter, Perform Better. 
publish_to: 'none'

version: 1.2.7+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_storage: ^14.0.1
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^19.5.0
  cloud_functions: ^7.0.1
  firebase_ai: ^5.2.0
  firebase_app_check: ^0.5.2
  http: ^1.5.0
  package_info_plus: ^8.3.1
  interactive_3d:
    path: packages/interactive_3d

  # State management
  flutter_riverpod: ^3.5.0

  # Navigation
  go_router: ^18.1.4

  # Premium UI and typography
  google_fonts: ^9.0.0
  flutter_svg: ^2.2.1
  cupertino_icons: ^1.0.8

  # Utilities
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  image_picker: ^1.2.1
  file_picker: ^10.3.3
  file_saver: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/clinical/
    - assets/icons/
    - assets/logo/
    - assets/anatomy/
    - assets/pharmacology/molecular/
    

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/atlas_launcher_icon.png
  adaptive_icon_background: "#0B1F3A"
  adaptive_icon_foreground: assets/icons/atlas_launcher_foreground.png
  remove_alpha_ios: true
